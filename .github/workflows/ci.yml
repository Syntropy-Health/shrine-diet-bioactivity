# Repo-level CI — typecheck + vitest + coverage gate
#
# Runs on every PR and on push to main/test.  Blocks merge on:
#   - TypeScript compile errors
#   - Vitest failures
#   - Coverage below thresholds declared in vitest.config.ts
#
# The main TS adapter is in the subdirectory `shrine-diet-bioactivity/`.
# Other dirs (mcp/, lightrag/) are Python packages or submodules and are not
# gated by this workflow.
#
# Data fixtures (Duke + FooDB + SymMap + HERB 2.0) are downloaded and the
# unified SQLite DB is built on first run, then cached across runs via
# actions/cache. The cache is split into restore + save so the (expensive)
# downloads survive even if a later step fails.
#
# Two kinds of step (#125) — read a red accordingly:
#   DATA PROVISIONING  restore/download/build the fixtures. A red here is the
#                      data plumbing or an external source (e.g. the chedi API),
#                      NOT the change under review.
#   VERIFICATION       typecheck + tests + coverage. A red here is the change.
#
# Why the schedule: GitHub EVICTS a cache nobody reads for 7 days, and a PR can
# only read its own and main's caches. main went 9 days without CI (10-03 ->
# 10-12), its fixtures cache was evicted, and every PR then spent ~1h45m
# re-downloading HERB 2.0 (MEASURED 2026-10-12; a warm run takes ~40 s). The
# twice-weekly run on main restores the cache (resetting the eviction clock) or
# rebuilds it.

name: CI

on:
  pull_request:
    branches: [main, test]
  push:
    branches: [main, test]
  workflow_dispatch:
  schedule:
    # Mon + Thu: the longest gap (Thu -> Mon) is 4 days, inside the 7-day eviction.
    - cron: '41 6 * * 1,4'

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Typecheck + Tests + Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shrine-diet-bioactivity
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: shrine-diet-bioactivity/.nvmrc
          cache: 'npm'
          cache-dependency-path: shrine-diet-bioactivity/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --- DATA PROVISIONING (downloads + decompress + DB build) --------------
      # Split into restore + save so the slow downloads (FooDB ~1h, HERB 2.0
      # ~35min) cache even if a later step fails. Bump the v<N> prefix in the
      # key to force a clean rebuild. Bump the downloads/build sub-prefixes
      # independently if only that layer's scripts change.

      - name: Restore data fixtures cache
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            shrine-diet-bioactivity/data
            shrine-diet-bioactivity/data_local_temp
            shrine-diet-bioactivity/data_local
          key: data-fixtures-v1-${{ hashFiles('shrine-diet-bioactivity/scripts/download-sources.ts', 'shrine-diet-bioactivity/scripts/download-symmap.ts', 'shrine-diet-bioactivity/scripts/download-herb2.ts', 'shrine-diet-bioactivity/src/herb2-download.ts', 'shrine-diet-bioactivity/scripts/decompress-datasets.ts', 'shrine-diet-bioactivity/scripts/build-herbal-db.ts', 'shrine-diet-bioactivity/scripts/load-symmap.ts', 'shrine-diet-bioactivity/scripts/load-herb2.ts', 'shrine-diet-bioactivity/scripts/build-symptom-crosswalk.ts', 'shrine-diet-bioactivity/scripts/migrate-kg-expansion.ts', 'shrine-diet-bioactivity/scripts/migrate-multi-source.ts', 'shrine-diet-bioactivity/config/data_sources.yaml') }}
          # Exact key only. A prefix fallback restored an OLDER full cache, and the
          # download scripts skip files that already exist, so a changed source URL
          # would silently rebuild from stale downloads (#125 review).

      # The downloads layer is its own entry: actions/cache matches on key AND a
      # version derived from the PATH LIST, so it must be restored with exactly the
      # path it was saved with (a restore-key on the 3-path restore above could
      # never match it — MEASURED: never read). The schedule restores it too, so it
      # is not evicted while the full entry keeps getting hits.
      - name: Restore downloads cache
        id: dl-cache
        if: steps.data-cache.outputs.cache-hit != 'true' || github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: |
            shrine-diet-bioactivity/data
          key: data-fixtures-v1-downloads-${{ hashFiles('shrine-diet-bioactivity/scripts/download-sources.ts', 'shrine-diet-bioactivity/scripts/download-symmap.ts', 'shrine-diet-bioactivity/scripts/download-herb2.ts', 'shrine-diet-bioactivity/src/herb2-download.ts', 'shrine-diet-bioactivity/config/data_sources.yaml') }}

      # hit       = the full fixtures (downloads + built DB) restored: nothing to do.
      # downloads = only the downloads layer restored (exact key): rebuild the DB.
      # miss      = nothing restored: download + build (cold).
      - name: Classify fixtures cache (HIT / DOWNLOADS / MISS)
        id: fixtures
        env:
          HIT: ${{ steps.data-cache.outputs.cache-hit }}
          DL_HIT: ${{ steps.dl-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" = "true" ]; then
            state=hit
          elif [ "$DL_HIT" = "true" ]; then
            state=downloads
          else
            state=miss
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          {
            echo "### Data fixtures cache: $(echo "$state" | tr '[:lower:]' '[:upper:]')"
            echo ""
            case "$state" in
              hit) echo "- provisioning skipped; verification runs on the cached fixtures" ;;
              downloads) echo "- downloads restored; rebuilding the DB only" ;;
              miss) echo "- COLD: downloading sources (HERB 2.0 alone has taken ~1h45m) and rebuilding" ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      # FooDB (~952 MB, 1h+ to download) is intentionally skipped: no current
      # test requires it. build-herbal-db.ts handles missing FooDB gracefully
      # by leaving compound_foods empty. The only consumer of FooDB-derived
      # data was the food-bridge test, which was deleted (orphaned debris
      # from 767bc07's mcp-opennutrition cleanup).
      - name: Download Duke source data
        if: steps.fixtures.outputs.state == 'miss'
        run: npx tsx scripts/download-sources.ts --duke-only

      - name: Download CMAUP source data
        if: steps.fixtures.outputs.state == 'miss'
        run: npx tsx scripts/download-sources.ts --cmaup-only

      - name: Download TTD source data
        if: steps.fixtures.outputs.state == 'miss'
        run: npx tsx scripts/download-sources.ts --ttd-only

      - name: Download SymMap xlsx files
        if: steps.fixtures.outputs.state == 'miss'
        run: npx tsx scripts/download-symmap.ts

      - name: Download HERB 2.0 via chedi API
        if: steps.fixtures.outputs.state == 'miss'
        # External API; has taken 1h44m. Fail a hung download instead of holding
        # the job to the 6 h workflow limit.
        timeout-minutes: 150
        run: npx tsx scripts/download-herb2.ts

      # Save the downloads-only cache so subsequent runs survive build/load
      # failures without re-downloading the ~1GB of source data.
      - name: Save downloads cache
        if: steps.fixtures.outputs.state == 'miss'
        uses: actions/cache/save@v4
        with:
          path: |
            shrine-diet-bioactivity/data
          key: data-fixtures-v1-downloads-${{ hashFiles('shrine-diet-bioactivity/scripts/download-sources.ts', 'shrine-diet-bioactivity/scripts/download-symmap.ts', 'shrine-diet-bioactivity/scripts/download-herb2.ts', 'shrine-diet-bioactivity/src/herb2-download.ts', 'shrine-diet-bioactivity/config/data_sources.yaml') }}

      - name: Decompress Duke + FooDB archives
        if: steps.fixtures.outputs.state != 'hit'
        run: npx tsx scripts/decompress-datasets.ts

      - name: Build unified SQLite (Duke + FooDB)
        if: steps.fixtures.outputs.state != 'hit'
        run: npx tsx scripts/build-herbal-db.ts

      - name: KG expansion migration (symptoms, targets)
        if: steps.fixtures.outputs.state != 'hit'
        run: npx tsx scripts/migrate-kg-expansion.ts

      - name: Multi-source migration (CMAUP + CTD + TTD)
        if: steps.fixtures.outputs.state != 'hit'
        run: npx tsx scripts/migrate-multi-source.ts

      - name: Load SymMap (5 bilingual reference tables)
        if: steps.fixtures.outputs.state != 'hit'
        run: npx tsx scripts/load-symmap.ts

      - name: Load HERB 2.0 (herbs + herb_disease evidence)
        if: steps.fixtures.outputs.state != 'hit'
        run: npx tsx scripts/load-herb2.ts

      # NOTE: scripts/build-symptom-crosswalk.ts is intentionally NOT run in
      # CI. It produces an auto-baseline that strips the hand-curated TCM
      # matches in research-journal/shared/symptom_crosswalk.json. The
      # committed JSON is the canonical source; the script is for local
      # regeneration / reviewer workflows only. The symptom-crosswalk test
      # passes against the committed JSON.

      # Save the full fixtures cache once everything builds successfully.
      - name: Save full fixtures cache
        if: steps.fixtures.outputs.state != 'hit'
        uses: actions/cache/save@v4
        with:
          path: |
            shrine-diet-bioactivity/data
            shrine-diet-bioactivity/data_local_temp
            shrine-diet-bioactivity/data_local
          key: data-fixtures-v1-${{ hashFiles('shrine-diet-bioactivity/scripts/download-sources.ts', 'shrine-diet-bioactivity/scripts/download-symmap.ts', 'shrine-diet-bioactivity/scripts/download-herb2.ts', 'shrine-diet-bioactivity/src/herb2-download.ts', 'shrine-diet-bioactivity/scripts/decompress-datasets.ts', 'shrine-diet-bioactivity/scripts/build-herbal-db.ts', 'shrine-diet-bioactivity/scripts/load-symmap.ts', 'shrine-diet-bioactivity/scripts/load-herb2.ts', 'shrine-diet-bioactivity/scripts/build-symptom-crosswalk.ts', 'shrine-diet-bioactivity/scripts/migrate-kg-expansion.ts', 'shrine-diet-bioactivity/scripts/migrate-multi-source.ts', 'shrine-diet-bioactivity/config/data_sources.yaml') }}

      # --- VERIFICATION (static checks + tests) -------------------------------

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: shrine-diet-bioactivity/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '| Metric | Pct |' >> "$GITHUB_STEP_SUMMARY"
            echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              for (const k of ['statements','branches','functions','lines']) {
                console.log(\`| \${k} | \${s[k].pct}% |\`);
              }
            " >> "$GITHUB_STEP_SUMMARY"
          fi
